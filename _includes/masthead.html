<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — Home">
      <span class="site-brand__mark" aria-hidden="true">AM</span>
      <span class="site-brand__copy">
        <strong>{{ site.title }}</strong>
        <span>Software engineering researcher</span>
      </span>
    </a>

    <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
      <span>Menu</span>
      <span class="site-nav__toggle-lines" aria-hidden="true"></span>
    </button>

    <nav id="primary-navigation" class="site-nav" aria-label="Primary navigation">
      <ul class="site-nav__links">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
      {% assign cta = site.data.navigation.cta %}
      <a class="site-nav__cta" href="{{ cta.url | relative_url }}"{% if page.url == cta.url %} aria-current="page"{% endif %}>{{ cta.title }} <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
